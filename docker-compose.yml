version: '3.8'

services:
  youtube-transcript-api:
    build: .
    image: youtube-transcript-api:latest
    container_name: youtube-transcript-api
    ports:
      - "9585:${PORT:-}"
    environment:
      # Optional: Add Webshare proxy credentials for bypassing YouTube blocking
      - WEBSHARE_PROXY_USERNAME=${WEBSHARE_PROXY_USERNAME:-}
      - WEBSHARE_PROXY_PASSWORD=${WEBSHARE_PROXY_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9585/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Optional: Mount volume for persistent cache (if implementing file-based cache in future)
    # volumes:
    #   - ./cache:/app/cache
